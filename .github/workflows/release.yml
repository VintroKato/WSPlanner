name: Build, sign & release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare artifact & Verification notes
        run: |
         cd app/build/outputs/apk/release
         
         mv *-signed.apk WSPlanner-${{ github.ref_name }}.apk
         
         HASH=$(sha256sum WSPlanner-${{ github.ref_name }}.apk | awk '{print $1}')
         echo "$HASH  WSPlanner-${{ github.ref_name }}.apk" > sha256sum.txt
         
         cat <<EOF > $GITHUB_WORKSPACE/release_notes.md
         ### 🛡️ Build verification & Integrity
         This APK was automatically built, signed, and attested by **GitHub Actions** directly from the source code.
         
         * **Release Tag:** \`${{ github.ref_name }}\`
         * **Source Commit:** [\`${{ github.sha }}\](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
         * **SHA-256 Checksum:**
           \`\`\`text
           ${HASH}
           \`\`\`
         
         #### Verify Provenance via GitHub CLI:
         \`\`\`bash
         gh attestation verify WSPlanner-${{ github.ref_name }}.apk --repo ${{ github.repository }}
         \`\`\`
         EOF

      - name: Generate attestation (SLSA Provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'app/build/outputs/apk/release/WSPlanner-*.apk'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/WSPlanner-*.apk
            app/build/outputs/apk/release/sha256sum.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
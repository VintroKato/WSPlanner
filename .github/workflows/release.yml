name: Build, sign & release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare artifact & release notes
        run: |
          COMMIT_MSG=$(git log -1 --no-merges --pretty=%s | tr '|' '/')
          FULL_SHA=$(git log -1 --no-merges --pretty=%H)
          APK_NAME="WSPlanner-${{ github.ref_name }}.apk"

          cd app/build/outputs/apk/release
          mv *-signed.apk "$APK_NAME"

          HASH=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "$HASH  $APK_NAME" > sha256sum.txt

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_HASH=$HASH" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"

          CHANGELOG_FILE="$GITHUB_WORKSPACE/.github/release-notes/changelist.md"
          {
            if [ -f "$CHANGELOG_FILE" ]; then
              TRIMMED=$(grep -v '^[[:space:]]*$' "$CHANGELOG_FILE" || true)
              if [ -n "$TRIMMED" ]; then
                echo "### What's changed"
                echo ""
                cat "$CHANGELOG_FILE"
                echo ""
                echo "---"
                echo ""
              fi
            fi

            echo "### Build info"
            echo ""
            echo "> **Automated Build:** This APK was compiled and signed automatically by **GitHub Actions** directly from the public source code. It was not built or modified locally by the maintainer"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **File** | \`${APK_NAME}\` |"
            echo "| **Commit** | ${FULL_SHA} (${COMMIT_MSG}) |"
            echo "| **SHA-256** | \`${HASH}\` |"
            echo "| **VirusTotal** | [Scan Report](https://www.virustotal.com/gui/file/${HASH}) |"
            echo ""
            echo "**Verify build provenance (GitHub CLI):**"
            echo "\`\`\`bash"
            echo "gh attestation verify ${APK_NAME} --repo ${{ github.repository }}"
            echo "\`\`\`"
            echo ""
            echo "---"
          } > "$GITHUB_WORKSPACE/release_notes.md"

      - name: Upload APK to VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY is not set, skipping VirusTotal upload."
            exit 0
          fi

          APK_PATH="app/build/outputs/apk/release/$APK_NAME"
          FILE_SIZE=$(stat -c%s "$APK_PATH")

          if [ "$FILE_SIZE" -gt 33554432 ]; then
            UPLOAD_URL=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/files/upload_url" \
              --header "x-apikey: $VT_API_KEY" | jq -r '.data')
          else
            UPLOAD_URL="https://www.virustotal.com/api/v3/files"
          fi

          RESPONSE=$(curl -s --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_API_KEY" \
            --header "accept: application/json" \
            --form "file=@$APK_PATH")

          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          if [ -n "$ANALYSIS_ID" ]; then
            echo "Uploaded to VirusTotal. Analysis ID: $ANALYSIS_ID"
            echo "Report URL: https://www.virustotal.com/gui/file/$APK_HASH"
          else
            echo "VirusTotal response: $RESPONSE"
          fi

      - name: Generate attestation (SLSA Provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'app/build/outputs/apk/release/WSPlanner-*.apk'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.COMMIT_MSG }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/WSPlanner-*.apk
            app/build/outputs/apk/release/sha256sum.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}